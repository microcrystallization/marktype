[package]
name = "marktype"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "Desktop Markdown and LaTeX editor with live preview and adaptive wallpaper themes"
license = "MIT"

[dependencies]
tao = "0.34"
wry = "0.53"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
regex = "1"
percent-encoding = "2"
tempfile = "3"
base64 = "0.22"
unicase = "2"
open = "5"
dunce = "1"
blake3 = "1.8"
ignore = "0.4"
trash = "5"
pathdiff = "0.2"
fs2 = "0.4"
flate2 = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd")))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
