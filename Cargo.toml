[package]
name = "marktype"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Windows Markdown and LaTeX editor with live preview and adaptive wallpaper themes"
license = "MIT"

[dependencies]
tao = "0.34"
wry = "0.53"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
directories = "6"
regex = "1"
percent-encoding = "2"
tempfile = "3"
base64 = "0.22"
unicase = "2"
open = "5"
dunce = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
