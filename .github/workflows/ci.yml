name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore Windows Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-release
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check frontend syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem ui -Filter '*.js') {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --release -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --release -- --nocapture
      - name: Build release binary
        run: cargo build --locked --release
