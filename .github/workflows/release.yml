name: Desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Windows Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-release
          cache-bin: "false"
          save-if: "false"
      - name: Run tests
        run: cargo test --locked --all-targets --release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installed = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($installed) {
            Write-Host "Using the available Inno Setup compiler."
            exit 0
          }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and portable archive
        shell: pwsh
        run: .\scripts\build-installer.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: MarkType-windows-x64
          if-no-files-found: error
          path: |
            dist/MarkType-Setup-*-x64.exe
            dist/MarkType-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt

  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-24.04, cache: linux-x64-release, script: linux, extension: deb }
          - { name: macOS Apple Silicon, runner: macos-15, cache: macos-arm64-release, script: macos, extension: dmg }
          - { name: macOS Intel, runner: macos-15-intel, cache: macos-x64-release, script: macos, extension: dmg }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v6
      - name: Install GTK and WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          cache-bin: "false"
          save-if: "false"
      - run: cargo test --locked --all-targets --release
      - run: bash scripts/build-${{ matrix.script }}.sh
      - uses: actions/upload-artifact@v6
        with:
          name: MarkType-${{ matrix.cache }}
          if-no-files-found: error
          path: dist/MarkType-*.${{ matrix.extension }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: MarkType-*
          merge-multiple: true
          path: dist
      - name: Write checksums for all packages
        working-directory: dist
        run: sha256sum -- *.exe *.zip *.deb *.dmg > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
