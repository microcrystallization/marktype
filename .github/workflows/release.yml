name: Windows packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Windows Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64-release
          cache-bin: "false"
          save-if: "false"
      - name: Run tests
        run: cargo test --locked --all-targets --release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installed = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($installed) {
            Write-Host "Using the available Inno Setup compiler."
            exit 0
          }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and portable archive
        shell: pwsh
        run: .\scripts\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MarkType-windows-x64
          if-no-files-found: error
          path: |
            dist/MarkType-Setup-*-x64.exe
            dist/MarkType-*-windows-x64-portable.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MarkType-windows-x64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
